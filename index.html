<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiBubbl — Stop fighting the algorithm. Start building your bubble.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #121216;
      --surface-elevated: #18181f;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --cyan: #38bdf8;
      --purple: #a855f7;
      --pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 22% 35%, rgba(56, 189, 248, 0.11), transparent 42%),
        radial-gradient(circle at 34% 62%, rgba(168, 85, 247, 0.12), transparent 45%),
        var(--bg);
    }

    /* Header */
    .top-header {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 24px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 20;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }

    .brand-orb {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), rgba(56, 189, 248, 0.25) 45%, rgba(168, 85, 247, 0.25) 100%);
      border: 1.5px solid transparent;
      background-clip: padding-box;
      box-shadow:
        0 0 0 1.5px rgba(56, 189, 248, 0.65),
        0 0 18px rgba(168, 85, 247, 0.35);
      position: relative;
    }

    /* Main Split Hero */
    .hero-main {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 24px 40px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 44px;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    @media (min-width: 1024px) {
      .hero-main {
        grid-template-columns: 1.05fr 0.95fr;
        gap: 64px;
        padding: 28px 48px 36px;
      }
    }

    /* Left Column: Headline + Card Stack */
    .left-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-headline {
      font-size: clamp(2rem, 4vw, 3.25rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: var(--text);
      margin-bottom: 36px;
    }

    .gradient-text {
      display: block;
      background: linear-gradient(90deg, #38bdf8 0%, #a855f7 55%, #ec4899 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card-stack-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .moment-card {
      position: absolute;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);
      background-size: cover;
      background-position: center;
    }

    .moment-card.left-card {
      width: 155px;
      height: 245px;
      left: 22px;
      transform: rotate(-11deg) translateY(10px);
      z-index: 5;
      opacity: 0.88;
      background-image: linear-gradient(135deg, rgba(251, 146, 60, 0.25), rgba(168, 85, 247, 0.3)),
        url('./images/moment-left.jpg');
      background-color: #1e1b2e;
    }

    .moment-card.right-card {
      width: 155px;
      height: 245px;
      right: 22px;
      transform: rotate(11deg) translateY(12px);
      z-index: 5;
      opacity: 0.88;
      background-image: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(236, 72, 153, 0.25)),
        url('./images/moment-right.jpg');
      background-color: #17202a;
    }

    .moment-card.center-card {
      width: 215px;
      height: 325px;
      z-index: 10;
      background-image: url('./images/moment-center.jpg');
      background-color: #201a2c;
    }

    .moment-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 12, 0.85) 0%, rgba(10, 10, 12, 0.1) 45%, transparent 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 14px 16px;
    }

    .moment-handle {
