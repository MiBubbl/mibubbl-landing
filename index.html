<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBubbl — Your thoughts, your moments, your bubble.</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090D16;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --cyan: #38bdf8;
            --pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem 1.5rem 5rem;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1.5px;
            max-width: 800px;
            margin-bottom: 1.25rem;
        }

        h1 span {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Waitlist Form Styling with Gradient Pill */
        .waitlist-wrapper {
            width: 100%;
            max-width: 460px;
            margin: 0 auto 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .waitlist-form {
            display: flex;
            width: 100%;
            position: relative;
            background: linear-gradient(#0f172a, #0f172a) padding-box,
                        linear-gradient(135deg, var(--cyan) 0%, var(--pink) 100%) border-box;
            border: 1.5px solid transparent;
            border-radius: 9999px;
            padding: 5px 6px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6),
                        0 0 18px rgba(236, 72, 153, 0.15);
            transition: box-shadow 0.25s ease, transform 0.2s ease;
        }

        .waitlist-form:focus-within {
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.35),
                        0 0 24px rgba(236, 72, 153, 0.35);
            transform: translateY(-1px);
        }

        .waitlist-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 0.65rem 1.15rem;
            font-family: inherit;
        }

        .waitlist-input::placeholder {
            color: var(--text-muted);
            opacity: 0.75;
        }

        .waitlist-btn {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--pink) 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            padding: 0.65rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);
        }

        .waitlist-btn:hover {
            opacity: 0.92;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(236, 72, 153, 0.4);
        }

        .waitlist-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .waitlist-feedback {
            font-size: 0.85rem;
            margin-top: 0.75rem;
            min-height: 20px;
            text-align: center;
        }

        .waitlist-feedback.success {
            color: #34d399;
        }

        .waitlist-feedback.error {
            color: #f87171;
        }

        /* Two-Column Feature Layout */
        .content-section {
            display: flex;
            align-items: flex-start;
            gap: 4rem;
            width: 100%;
            max-width: 1150px;
            margin: 2rem auto 0;
            padding: 0 1rem;
            text-align: left;
        }

        /* Left Column: Clean Flat UI Screen Frames */
        .phone-column {
            flex: 1;
            display: flex;
            gap: 1.25rem;
            justify-content: center;
        }

        .phone-mockup {
            flex: 1;
            max-width: 280px;
            border-radius: 20px;
            overflow: hidden;
            background: #000000;
            border: 2px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9),

            transition
