<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBubbl — Your thoughts, your moments, your bubble</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 2.5rem 1rem;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Waitlist Form Styling */
        .waitlist-wrapper {
            width: 100%;
            max-width: 460px;
            margin: 1.5rem auto 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .waitlist-form {
            display: flex;
            width: 100%;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid var(--border);
            border-radius: 9999px;
            padding: 5px 6px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .waitlist-form:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .waitlist-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 0.65rem 1.15rem;
            font-family: inherit;
        }

        .waitlist-input::placeholder {
            color: var(--text-muted);
            opacity: 0.75;
        }

        .waitlist-btn {
            background: var(--accent);
            color: #090d16;
            border: none;
            border-radius: 9999px;
            padding: 0.65rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        .waitlist-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .waitlist-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .waitlist-feedback {
            font-size: 0.85rem;
            margin-top: 0.65rem;
            min-height: 20px;
            text-align: center;
        }

        .waitlist-feedback.success {
            color: #34d399;
        }

        .waitlist-feedback.error {
            color: #f87171;
        }

        /* Mockup Container */
        .mockups-container {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
        }

        /* Android Phone Frame */
        .phone-frame {
            width: 280px;
            height: 570px;
            background: #1a2234;
            border-radius: 40px;
            border: 4px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 30px var(--accent-glow);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Phone Screen Content */
        .phone-screen {
            background: var(--card-bg);
            flex: 1;
            margin: 10px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Android Camera Punch-hole */
        .camera-notch {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            z-index: 20;
        }

        /* Fake Mobile Status Bar */
        .status-bar {
            height: 36px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.7rem;
            color: #fff;
            font-weight: 600;
            z-index: 10;
            flex-shrink: 0;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        /* Image Container */
        .image-container {
            flex: 1;
            overflow: hidden;
            background: #000;
            display: flex;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .footer-divider {
            margin: 0 0.5rem;
            color: var(--border);
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: translateY(15px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: left;
        }

        .modal-body h4 {
            color: var(--text-main);
            margin-top: 0.5rem;
            font-size: 1.05rem;
        }

        .modal-body ul {
            padding-left: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        @media (max-width: 650px) {
            .phone-frame {
                width: 260px;
                height: 520px;
            }
            h1 { font-size: 2.3rem; }
            .waitlist-wrapper { max-width: 100%; }
            .waitlist-btn { padding: 0.65rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>MiBubbl</h1>
        <div class="tagline">Your thoughts, your moments, your bubble.</div>
        <p>A fresh space for creators to showcase themselves, share their world, and interact directly with their community.</p>
        
        <!-- Waitlist Form Container -->
        <div class="waitlist-wrapper">
            <form id="waitlist-form" class="waitlist-form">
                <input 
                    type="email" 
                    id="waitlist-email" 
                    class="waitlist-input"
                    placeholder="Enter your email" 
                    required 
                    autocomplete="email"
                />
                <button type="submit" id="waitlist-btn" class="waitlist-btn">Join Waitlist</button>
            </form>
            <div id="waitlist-feedback" class="waitlist-feedback"></div>
        </div>
    </div>

    <!-- Phone Mockups -->
    <div class="mockups-container">
        <!-- Phone 1 -->
        <div class="phone-frame">
            <div class="camera-notch"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">5G <b>99%</b></div>
                </div>
                <div class="image-container">
                    <img src="screen1.png" alt="MiBubbl App Screen 1">
                </div>
            </div>
        </div>

        <!-- Phone 2 -->
        <div class="phone-frame">
            <div class="camera-notch"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">5G <b>99%</b></div>
                </div>
                <div class="image-container">
                    <img src="screen2.png" alt="MiBubbl App Screen 2">
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>
            Launching soon &bull; Contact: <a href="mailto:hello@mibubbl.com">hello@mibubbl.com</a> 
            <span class="footer-divider">|</span> 
            <a href="#" id="termsLink">Terms of Service</a> 
            <span class="footer-divider">|</span> 
            <a href="#" id="privacyLink">Privacy Policy</a>
        </p>
    </footer>

    <!-- Policy Modal Overlay -->
    <div id="policyModal" class="modal-overlay" onclick="handleOutsideClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Terms of Service</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://rnlnkgjwynhnfgsshtcx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Ktboe_fpEnRZ56luzOWhtw_601FwPQX';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.warn('Supabase initialization failed:', err);
        }

        const waitlistForm = document.getElementById('waitlist-form');
        const emailInput = document.getElementById('waitlist-email');
        const submitBtn = document.getElementById('waitlist-btn');
        const feedback = document.getElementById('waitlist-feedback');

        if (waitlistForm) {
            waitlistForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim().toLowerCase();
                if (!email) return;

                if (!supabaseClient) {
                    feedback.textContent = 'Waitlist service unavailable right now. Please try again later.';
                    feedback.className = 'waitlist-feedback error';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Saving...';
                feedback.textContent = '';
                feedback.className = 'waitlist-feedback';

                try {
                    const { error } = await supabaseClient
                        .from('waitlist')
                        .insert([{ email }]);

                    if (error) {
                        if (error.code === '23505') {
                            feedback.textContent = "You're already on the list! We'll notify you soon.";
                            feedback.className = 'waitlist-feedback success';
                        } else {
                            feedback.textContent = 'Something went wrong. Please try again.';
                            feedback.className = 'waitlist-feedback error';
                        }
                    } else {
                        feedback.textContent = "You're on the list! We'll be in touch soon.";
                        feedback.className = 'waitlist-feedback success';
                        emailInput.value = '';
                    }
                } catch (err) {
                    feedback.textContent = 'Unable to connect. Please check your network.';
                    feedback.className = 'waitlist-feedback error';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Join Waitlist';
                }
            });
        }

        // Policy Modal Data & Handlers
        const policyData = {
            terms: {
                title: "Terms of Service",
                content: `
                    <p><strong>Effective Date:</strong> November 1, 2026</p>
                    <p>Welcome to <strong>MiBubbl</strong>. By accessing or using our website, web application, and services, you agree to be bound by these Terms of Service. Please read them carefully before creating an account or subscribing to Bubbl+.</p>
                    
                    <h4>1. Account Eligibility & Age Requirement</h4>
                    <p>&bull; <strong>Strictly 18+:</strong> You must be at least 18 years of age to register an account, post content, or purchase subscriptions on MiBubbl.<br>&bull; <strong>Account Security:</strong> You are responsible for safeguarding your login credentials and any activity under your account.</p>
                    
                    <h4>2. Intellectual Property & Creator Ownership</h4>
                    <p>&bull; <strong>Creator Rights:</strong> Creators retain 100% ownership of the copyright and IP rights to all content they post (Thoughts, Moments, Snippets, Vibes).<br>&bull; <strong>Platform License:</strong> You grant MiBubbl a non-exclusive, worldwide license to host, display, and promote your content strictly to operate the platform.<br>&bull; <strong>Absolute Protection Against AI Training:</strong> MiBubbl explicitly prohibits any use of user-generated content for training artificial intelligence, machine learning models, or generative AI systems.</p>
                    
                    <h4>3. Content Guidelines (The "Skin vs. Nudity" Policy)</h4>
                    <p>&bull; <strong>Strictly Prohibited:</strong> Explicit pornography, exposed genitalia, sexual acts, or illegal content.<br>&bull; <strong>Allowed & Welcome:</strong> Swimwear, lingerie, artistic skin-bearing photography, fitness content, and fashion.<br>&bull; <strong>Consequences:</strong> Violating content will be removed immediately; repeat violations lead to account termination.</p>
                    
                    <h4>4. Code of Conduct & Anti-Harassment</h4>
                    <p>&bull; Heated debates and artistic expression are welcome.<br>&bull; Targeted harassment, doxxing, stalking, hate speech, or malicious abuse are strictly prohibited and will result in immediate bans.</p>
                    
                    <h4>5. External Links & Third-Party Content</h4>
                    <p>&bull; Permitted for official social media profiles, portfolios, and personal brands.<br>&bull; Prohibited for illegal content, malware, phishing, explicit adult sites, or spam. MiBubbl assumes no liability for external third-party sites.</p>
                    
                    <h4>6. Copyright Infringement & DMCA Takedown Policy</h4>
                    <p>If you believe content on MiBubbl infringes your copyright, submit a notification to our designated contact at support@mibubbl.com for prompt safe harbor removal.</p>
                    
                    <h4>7. Data Collection, Storage & Privacy</h4>
                    <p>Account details and uploaded content are stored securely through cloud providers (Supabase) and payment processors (Stripe). Review our Privacy Policy for full details under UK data protection laws.</p>
                    
                    <h4>8. Bubbl+ Subscriptions, Billing & Cancellations</h4>
                    <p>&bull; <strong>Pricing:</strong> &pound;7.99 GBP / $9.99 USD per month, auto-renewing via Stripe.<br>&bull; <strong>Cancellations:</strong> Cancel anytime via the secure Stripe Customer Portal; benefits remain active until the billing period ends.<br>&bull; <strong>Refunds:</strong> Non-refundable except where required by law. Fraudulent chargebacks result in immediate termination.</p>
                    
                    <h4>9. Suspension, Termination & Liability</h4>
                    <p>MiBubbl reserves the right to suspend or terminate accounts immediately for terms violations. The platform is provided on an "as-is" basis with liability capped to the maximum extent permitted by law.</p>
                    
                    <h4>10. Governing Law</h4>
                    <p>These Terms shall be governed by and construed in accordance with the laws of England and Wales, subject to the exclusive jurisdiction of its courts.</p>
                `
            },
            privacy: {
                title: "Privacy Policy",
                content: `
                    <p><strong>Effective Date:</strong> November 1, 2026</p>
                    <p>At <strong>MiBubbl</strong>, we respect your privacy and are committed to protecting your personal data. This Privacy Policy explains how we collect, use, store, and share your information.</p>
                    
                    <h4>1. Information We Collect</h4>
                    <p>&bull; <strong>Account Information:</strong> Email address, chosen username, and profile details.<br>&bull; <strong>User-Generated Content:</strong> Thoughts, Moments, Snippets, Vibes, and profile images.<br>&bull; <strong>Billing & Transaction Data:</strong> Processed securely via Stripe; we do not store full payment card numbers.<br>&bull; <strong>Technical & Usage Data:</strong> IP address, browser type, device details, and interaction logs.</p>
                    
                    <h4>2. How We Use Your Information (Lawful Bases)</h4>
                    <p>&bull; <strong>Contractual Necessity:</strong> To operate feeds, manage profiles, display posts, and handle Stripe subscription billing.<br>&bull; <strong>Legitimate Interests:</strong> To monitor activity, prevent fraud, and enforce Content Guidelines for platform safety.<br>&bull; <strong>Legal Compliance:</strong> Retaining financial records as required by UK tax laws.</p>
                    
                    <h4>3. How We Store and Protect Your Data</h4>
                    <p>&bull; Stored via secure cloud infrastructure (Supabase) using AES-256 and TLS encryption.<br>&bull; Retained while active; data is removed upon account deletion except for required financial/tax records (kept for up to 6 years).</p>
                    
                    <h4>4. Sharing of Information with Third Parties</h4>
                    <p>We never sell or trade personal data. We share information only with Stripe (payments) and Supabase (cloud storage) under strict data processing agreements.</p>
                    
                    <h4>5. Your Rights Under UK Data Protection Law</h4>
                    <p>Under UK GDPR, you have the right to access, rectify, erase, or restrict/object to your data processing. Contact us at support@mibubbl.com or via your account settings.</p>
                    
                    <h4>6. Children's Privacy</h4>
                    <p>MiBubbl is strictly an 18+ platform. Underage accounts are terminated and deleted immediately upon discovery.</p>
                    
                    <h4>7. Changes & Contact</h4>
                    <p>Updates are reflected via the Effective Date. For questions or concerns, contact us at hello@mibubbl.com.</p>
                `
            }
        };

        const modal = document.getElementById('policyModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');

        document.getElementById('termsLink').addEventListener('click', (e) => {
            e.preventDefault();
            openModal('terms');
        });

        document.getElementById('privacyLink').addEventListener('click', (e) => {
            e.preventDefault();
            openModal('privacy');
        });

        function openModal(type) {
            modalTitle.innerText = policyData[type].title;
            modalContent.innerHTML = policyData[type].content;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleOutsideClick(event) {
            if (event.target.id === 'policyModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
