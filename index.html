<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBubbl — Your thoughts, your moments, your bubble</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 2.5rem 1rem;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Mockup Container */
        .mockups-container {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
        }

        /* Android Phone Frame */
        .phone-frame {
            width: 280px;
            height: 570px;
            background: #1a2234;
            border-radius: 40px;
            border: 4px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 30px var(--accent-glow);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Phone Screen Content */
        .phone-screen {
            background: var(--card-bg);
            flex: 1;
            margin: 10px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Android Camera Punch-hole */
        .camera-notch {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            z-index: 20;
        }

        /* Fake Mobile Status Bar */
        .status-bar {
            height: 36px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.7rem;
            color: #fff;
            font-weight: 600;
            z-index: 10;
            flex-shrink: 0;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        /* Image Container */
        .image-container {
            flex: 1;
            overflow: hidden;
            background: #000;
            display: flex;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: translateY(15px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-body h4 {
            color: var(--text-main);
            margin-top: 0.5rem;
            font-size: 1.05rem;
        }

        .modal-body ul {
            padding-left: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        @media (max-width: 650px) {
            .phone-frame {
                width: 260px;
                height: 520px;
            }
            h1 { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>MiBubbl</h1>
        <div class="tagline">Your thoughts, your moments, your bubble.</div>
        <p>A fresh space for creators to showcase themselves, share their world, and interact directly with their community.</p>
    </div>

    <!-- Phone Mockups -->
    <div class="mockups-container">
        
        <!-- Phone 1 -->
        <div class="phone-frame">
            <div class="camera-notch"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">5G <b>99%</b></div>
                </div>
                <div class="image-container">
                    <img src="screen1.png" alt="MiBubbl App Screen 1">
                </div>
            </div>
        </div>

        <!-- Phone 2 -->
        <div class="phone-frame">
            <div class="camera-notch"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">5G <b>99%</b></div>
                </div>
                <div class="image-container">
                    <img src="screen2.png" alt="MiBubbl App Screen 2">
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>Launching soon. Get in touch: <a href="mailto:hello@mibubbl.com">hello@mibubbl.com</a></p>
        <div class="footer-links">
            <a onclick="openModal('terms')">Terms of Service</a>
            <a onclick="openModal('privacy')">Privacy Policy</a>
        </div>
    </footer>

    <!-- Policy Modal Overlay -->
    <div id="policyModal" class="modal-overlay" onclick="handleOutsideClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Terms of Service</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- Dynamic text populated via JS -->
            </div>
        </div>
    </div>

    <script>
        const policyData = {
            terms: {
                title: "Terms of Service",
                content: `
                    <p><strong>Last Updated:</strong> November 2026</p>
                    <p>Welcome to MiBubbl. By accessing or using our platform, you agree to be bound by these Terms of Service.</p>
                    
                    <h4>1. Accounts & Registration</h4>
                    <p>You must provide accurate information when creating your account. You are responsible for maintaining the security of your credentials.</p>
                    
                    <h4>2. Bubbl+ Subscriptions & Billing</h4>
                    <p>Bubbl+ is billed at a flat rate of £7.99 per month through Stripe. Subscriptions automatically renew unless canceled prior to the billing period. You may cancel at any time from your account settings.</p>
                    
                    <h4>3. User Conduct & Content</h4>
                    <p>You retain ownership of your content, but grant MiBubbl license to display it. You agree not to post offensive, abusive, or illegal content or malicious external links. We reserve the right to remove content and suspend accounts violating these terms.</p>
                `
            },
            privacy: {
                title: "Privacy Policy",
                content: `
                    <p><strong>Last Updated:</strong> November 2026</p>
                    <p>At MiBubbl, we respect your privacy and protect your personal data.</p>
                    
                    <h4>1. Information We Collect</h4>
                    <p>We collect your email address, username, profile details, and user-generated content (moments, snippets, and links). Payment data is securely processed via Stripe; we do not store raw payment card details.</p>
                    
                    <h4>2. How We Use Data</h4>
                    <p>Your information is used to maintain your profile, manage Bubbl+ feature access, and enforce platform safety against abuse or malicious links.</p>
                    
                    <h4>3. Data Security</h4>
                    <p>Your data is securely stored using Supabase with encrypted database policies. We never sell or trade your personal information.</p>
                `
            }
        };

        function openModal(type) {
            const modal = document.getElementById('policyModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');

            title.innerText = policyData[type].title;
            content.innerHTML = policyData[type].content;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('policyModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleOutsideClick(event) {
            if (event.target.id === 'policyModal') {
                closeModal();
            }
        }
    </script>

</body>
</html>
