<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBubbl — Your thoughts, your moments, your bubble</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 2.5rem 1rem;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Mockup Container */
        .mockups-container {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
        }

        /* Android Phone Frame */
        .phone-frame {
            width: 280px;
            height: 570px;
            background: #1a2234;
            border-radius: 40px;
            border: 4px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 30px var(--accent-glow);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Phone Screen Content */
        .phone-screen {
            background: var(--card-bg);
            flex: 1;
            margin: 10px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Android Camera Punch-hole */
        .camera-notch {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            z-index: 20;
        }

        /* Fake Mobile Status Bar */
        .status-bar {
            height: 36px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.7rem;
            color: #fff;
            font-weight: 600;
            z-index: 10;
            flex-shrink: 0;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        /* Image Container */
        .image-container {
            flex: 1;
            overflow: hidden;
            background: #000;
            display: flex;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .phone-frame {
                width: 260px;
                height: 520px;
            }
            h1 { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>MiBubbl</h1>
        <div class="tagline">Your thoughts, your moments, your bubble.</div>
        <p>A fresh space for creators to showcase themselves, share their world, and interact directly with their community.</p>
    </div>

    <!-- Phone Mockups -->
    <div class="mockups-container">
        
        <!-- Phone 1 -->
        <div class="phone-frame">
            <div class="camera-notch"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">5G <b>99%</b></div>
                </div>
                <div class="image-container">
                    <img src="screen1.png" alt="MiBubbl App Screen 1">
                </div>
            </div>
        </div>

        <!-- Phone 2 -->
        <div class="phone-frame">
            <div class="camera-notch"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">5G <b>99%</b></div>
                </div>
                <div class="image-container">
                    <img src="screen2.png" alt="MiBubbl App Screen 2">
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>Launching soon. Get in touch: <a href="mailto:hello@mibubbl.com">hello@mibubbl.com</a></p>
    </footer>

</body>
</html>
